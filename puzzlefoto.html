        <span class="font-label-sm text-label-sm">Game</span>
      </a>
      <a class="flex flex-col items-center justify-center gap-xs w-20 h-full text-on-surface-variant transition-all duration-300 transform active:scale-95" data-path="cerita" href="cerita.html">

        <span class="font-label-sm text-label-sm">Cerita!</span>
      </a>
    </div>
  </nav>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const uploadInput = document.getElementById('image-upload');
        const gridContainer = document.getElementById('puzzle-grid');
        const previewContainer = document.getElementById('preview-container');
        const previewImage = document.getElementById('preview-image');
        const btnPreview = document.getElementById('btn-preview');
        const moveCountEl = document.getElementById('move-count');
        const finalMovesEl = document.getElementById('final-moves');
        const successOverlay = document.getElementById('success-overlay');
        const btnRestart = document.getElementById('btn-restart');
        
        const btnGrid3 = document.getElementById('grid-3');
        const btnGrid4 = document.getElementById('grid-4');

        let gridSize = 3; // default 3x3
        let currentImageSrc = null;
        let tiles = [];
        let moves = 0;
        let emptyIndex = gridSize * gridSize - 1; // last slot is empty initially
        let isShuffling = false;

        // Grid selection
        const setGridSize = (size) => {
            if(isShuffling) return;
            gridSize = size;
            emptyIndex = gridSize * gridSize - 1;
            
            // UI update
            if(size === 3) {
                btnGrid3.className = 'px-sm py-unit rounded-md bg-primary-container text-on-primary-container font-label-bold text-label-sm active:scale-90 transition-transform shadow-sm';
                btnGrid4.className = 'px-sm py-unit rounded-md bg-transparent text-on-surface-variant font-label-bold text-label-sm active:scale-90 transition-transform';
            } else {
                btnGrid4.className = 'px-sm py-unit rounded-md bg-primary-container text-on-primary-container font-label-bold text-label-sm active:scale-90 transition-transform shadow-sm';
                btnGrid3.className = 'px-sm py-unit rounded-md bg-transparent text-on-surface-variant font-label-bold text-label-sm active:scale-90 transition-transform';
            }
            
            if(currentImageSrc) initPuzzle(currentImageSrc);
        };

        btnGrid3.addEventListener('click', () => setGridSize(3));
        btnGrid4.addEventListener('click', () => setGridSize(4));

        // Image Upload
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentImageSrc = event.target.result;
                    previewImage.src = currentImageSrc;
                    initPuzzle(currentImageSrc);
                };
                reader.readAsDataURL(file);
            }
        });
        
        function createEmojiShower() {
            const emojis = ['🎉', '✨', '💖', '🌟', '🧩', '🏆'];
            for(let i=0; i<30; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'emoji-shower';
                    el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.animationDuration = (Math.random() * 2 + 1) + 's';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 3000);
                }, i * 100);
            }
        }

        // Initialize Puzzle
        function initPuzzle(imgSrc) {
            gridContainer.innerHTML = '';
            tiles = [];
            moves = 0;
            updateMoves();
            successOverlay.classList.remove('opacity-100', 'pointer-events-auto');
            successOverlay.classList.add('opacity-0', 'pointer-events-none');
            
            btnPreview.classList.remove('opacity-50', 'pointer-events-none');
            
            const totalTiles = gridSize * gridSize;
            const tileSize = 100 / gridSize;
            
            // First show them in order
            let currentOrder = Array.from({length: totalTiles}, (_, i) => i);
            emptyIndex = totalTiles - 1;

            for (let i = 0; i < totalTiles; i++) {
                const tile = document.createElement('div');
                tile.className = 'absolute bg-surface rounded-lg shadow-sm transition-all duration-300 ease-in-out cursor-pointer hover:shadow-md active:scale-95 flex items-center justify-center overflow-hidden border border-outline-variant/30';
                
                // Style sizing - leave gap
                tile.style.width = `calc(${tileSize}% - 6px)`;
                tile.style.height = `calc(${tileSize}% - 6px)`;
                
                updateTilePosition(tile, i);

                const correctRow = Math.floor(i / gridSize);
                const correctCol = i % gridSize;

                if (i !== totalTiles - 1) { // Not empty tile
                    const innerImg = document.createElement('div');
                    innerImg.className = 'w-full h-full bg-cover';
                    innerImg.style.backgroundImage = `url(${imgSrc})`;
                    innerImg.style.backgroundSize = `${gridSize * 100}% ${gridSize * 100}%`;
                    innerImg.style.backgroundPosition = `${(correctCol / (gridSize - 1)) * 100}% ${(correctRow / (gridSize - 1)) * 100}%`;
                    
                    // Add subtle inner shadow for puzzle feel
                    innerImg.style.boxShadow = 'inset 0 0 10px rgba(0,0,0,0.1)';

                    tile.appendChild(innerImg);
                    tile.dataset.correctId = i;
                } else {
                    tile.classList.add('opacity-0', 'pointer-events-none'); // Hidden empty slot
                    tile.dataset.correctId = 'empty';
                }

                tile.dataset.currentIndex = i;
                tile.addEventListener('click', () => handleTileClick(tile));
                
                tiles.push(tile);
                gridContainer.appendChild(tile);
            }
            
            // Trigger shuffle animation after brief delay
            isShuffling = true;
            setTimeout(() => shuffleTiles(), 800);
        }
        
        function shuffleTiles() {
            // Solvable shuffle (even inversions)
            // For simple implementation, just random valid moves
            let currentEmpty = gridSize * gridSize - 1;
            let shuffleMoves = gridSize * 15; // More moves for larger grid
            let lastMoved = -1;
            
            const doMove = (movesLeft) => {
                if(movesLeft <= 0) {
                    isShuffling = false;
                    return;
                }
                
                // Find valid neighbors
                const row = Math.floor(currentEmpty / gridSize);
                const col = currentEmpty % gridSize;
                let neighbors = [];
                
                if(row > 0) neighbors.push(currentEmpty - gridSize); // Top
                if(row < gridSize - 1) neighbors.push(currentEmpty + gridSize); // Bottom
                if(col > 0) neighbors.push(currentEmpty - 1); // Left
                if(col < gridSize - 1) neighbors.push(currentEmpty + 1); // Right
                
                // Filter out the tile we just moved to avoid immediate backtrack
                neighbors = neighbors.filter(n => n !== lastMoved);
                
                const targetIdx = neighbors[Math.floor(Math.random() * neighbors.length)];
                
                const tileToMove = tiles.find(t => parseInt(t.dataset.currentIndex) === targetIdx);
                const emptyTile = tiles.find(t => parseInt(t.dataset.currentIndex) === currentEmpty);
                
                tileToMove.dataset.currentIndex = currentEmpty;
                emptyTile.dataset.currentIndex = targetIdx;
                
                updateTilePosition(tileToMove, currentEmpty);
                updateTilePosition(emptyTile, targetIdx);
                
                lastMoved = currentEmpty;
                currentEmpty = targetIdx;
                emptyIndex = currentEmpty;
                
                setTimeout(() => doMove(movesLeft - 1), 50);
            };
            
            doMove(shuffleMoves);
        }

        function updateTilePosition(tile, index) {
            const row = Math.floor(index / gridSize);
            const col = index % gridSize;
            const tileSize = 100 / gridSize;
            
            // Add margin offset matching the gap calculation
            tile.style.top = `calc(${row * tileSize}% + 3px)`;
            tile.style.left = `calc(${col * tileSize}% + 3px)`;
        }

        function handleTileClick(tile) {
            if(isShuffling) return;
            
            const currentIndex = parseInt(tile.dataset.currentIndex);
            
            // Check if adjacent to empty
            if (isAdjacent(currentIndex, emptyIndex)) {
                // Swap
                const emptyTile = tiles.find(t => parseInt(t.dataset.currentIndex) === emptyIndex);
                
                // Update dataset
                tile.dataset.currentIndex = emptyIndex;
                emptyTile.dataset.currentIndex = currentIndex;
                
                // Update visuals
                updateTilePosition(tile, emptyIndex);
                updateTilePosition(emptyTile, currentIndex);
                
                // Update new empty index
                emptyIndex = currentIndex;
                
                moves++;
                updateMoves();
                checkWin();
            }
        }

        function isAdjacent(index1, index2) {
            const r1 = Math.floor(index1 / gridSize);
            const c1 = index1 % gridSize;
            const r2 = Math.floor(index2 / gridSize);
            const c2 = index2 % gridSize;
            
            return (Math.abs(r1 - r2) === 1 && c1 === c2) || (Math.abs(c1 - c2) === 1 && r1 === r2);
        }

        function checkWin() {
            let isWin = true;
            tiles.forEach(tile => {
                const current = parseInt(tile.dataset.currentIndex);
                const correct = tile.dataset.correctId === 'empty' ? gridSize*gridSize - 1 : parseInt(tile.dataset.correctId);
                if (current !== correct) isWin = false;
            });

            if (isWin) {
                finalMovesEl.textContent = moves;
                setTimeout(() => {
                    successOverlay.classList.remove('opacity-0', 'pointer-events-none');
                    successOverlay.classList.add('opacity-100', 'pointer-events-auto');
                    // Fill empty tile
                    const emptyTile = tiles.find(t => t.dataset.correctId === 'empty');
                    if(emptyTile) emptyTile.classList.remove('opacity-0');
                    createEmojiShower();
                }, 300);
            }
        }

        function updateMoves() {
            moveCountEl.textContent = moves;
        }

        // Preview interaction - updated for better mobile UX
        const showPreview = (e) => { 
            if(e) e.preventDefault(); 
            if(currentImageSrc) previewContainer.classList.remove('hidden', 'opacity-0'); 
        };
        const hidePreview = () => { 
            previewContainer.classList.add('opacity-0');
            setTimeout(() => {
                if(previewContainer.classList.contains('opacity-0')) {
                    previewContainer.classList.add('hidden');
                }
            }, 300);
        };

        btnPreview.addEventListener('mousedown', showPreview);
        btnPreview.addEventListener('mouseup', hidePreview);
        btnPreview.addEventListener('mouseleave', hidePreview);
        
        btnPreview.addEventListener('touchstart', showPreview, {passive: false});
        btnPreview.addEventListener('touchend', hidePreview);
        btnPreview.addEventListener('touchcancel', hidePreview);

        btnRestart.addEventListener('click', () => {
             if(currentImageSrc) initPuzzle(currentImageSrc);
        });

    });
</script></main></body></html>
