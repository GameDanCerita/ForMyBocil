<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-fixed-dim": "#80dd52", "on-error-container": "#93000a", "on-tertiary-fixed-variant": "#1d5200", "primary-fixed-dim": "#ffb0d0", "on-tertiary": "#ffffff", "secondary": "#68548d", "on-secondary-container": "#5d4a82", "secondary-fixed": "#ebdcff", "surface-tint": "#ac2471", "on-surface": "#24181d", "on-primary": "#ffffff", "on-primary-fixed-variant": "#8c0058", "surface": "#fff8f8", "tertiary": "#296c00", "surface-container-highest": "#f3dde3", "inverse-surface": "#3a2d32", "surface-container-lowest": "#ffffff", "surface-bright": "#fff8f8", "outline": "#897179", "on-primary-fixed": "#3d0024", "error": "#ba1a1a", "primary-fixed": "#ffd8e6", "on-tertiary-container": "#153f00", "on-secondary-fixed-variant": "#503d73", "on-error": "#ffffff", "primary": "#ac2471", "surface-variant": "#f3dde3", "secondary-container": "#d6beff", "on-tertiary-fixed": "#072100", "on-primary-container": "#6e0044", "surface-container": "#ffe8ef", "inverse-on-surface": "#ffecf1", "on-background": "#24181d", "inverse-primary": "#ffb0d0", "surface-container-high": "#f9e3e9", "secondary-fixed-dim": "#d3bcfc", "error-container": "#ffdad6", "surface-dim": "#ead5db", "on-secondary-fixed": "#230f45", "surface-container-low": "#fff0f3", "outline-variant": "#dcbfc9", "on-surface-variant": "#564149", "background": "#fff8f8", "primary-container": "#ff69b4", "on-secondary": "#ffffff", "tertiary-fixed": "#9bfa6b", "tertiary-container": "#5ab32c" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "xl": "32px", "xs": "4px", "container-margin": "20px", "md": "16px", "gutter": "16px", "lg": "24px", "unit": "4px", "sm": "8px" }, "fontFamily": { "body-lg": ["Quicksand"], "body-md": ["Quicksand"], "label-bold": ["Quicksand"], "headline-lg": ["Quicksand"], "headline-md": ["Quicksand"], "headline-lg-mobile": ["Quicksand"], "label-sm": ["Quicksand"] }, "fontSize": { "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "500" }], "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "500" }], "label-bold": ["14px", { "lineHeight": "1.0", "fontWeight": "700" }], "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }], "headline-lg-mobile": ["26px", { "lineHeight": "1.2", "fontWeight": "700" }], "label-sm": ["12px", { "lineHeight": "1.0", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(255,105,180,0.08)]"><div class="h-16 px-container-margin flex items-center gap-md"><button class="w-10 h-10 flex items-center justify-center text-primary active:scale-90 transition-transform" onclick="history.back()"><span class="material-symbols-outlined">chevron_left</span></button><h1 class="font-headline-md text-headline-md text-on-surface">Game Detail</h1></div></header><main class="flex-1 relative w-full pt-16 bg-transparent"><div class="flex flex-col w-full px-container-margin py-lg gap-lg">
<div class="flex flex-col gap-sm text-center">
<h2 class="font-headline-lg text-headline-lg text-primary">Pasangkan Emoji</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Temukan semua pasangan yang sama!</p>
</div>

<!-- Pilihan Jumlah Kartu -->
<div class="flex items-center justify-between bg-surface-container-low rounded-xl px-md py-sm border border-outline-variant/30">
<label class="font-label-bold text-label-bold text-on-surface-variant" for="difficulty-select">Jumlah Kartu:</label>
<select class="bg-surface-container-lowest border border-outline-variant text-primary font-label-bold rounded-lg px-md py-xs focus:outline-none focus:ring-2 focus:ring-primary" id="difficulty-select">
<option value="4">Mudah (8 Kartu)</option>
<option selected="" value="8">Sedang (16 Kartu)</option>
<option value="12">Sulit (24 Kartu)</option>
</select>
</div>

<div class="flex justify-between items-center bg-surface-container-high rounded-xl p-md" id="game-stats">
<div class="flex flex-col gap-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Waktu</span>
<span class="font-headline-md text-headline-md text-primary" id="time-display">00:00</span>
</div>
<div class="flex flex-col gap-xs text-right">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Langkah</span>
<span class="font-headline-md text-headline-md text-secondary" id="moves-display">0</span>
</div>
</div>
<div class="grid grid-cols-4 gap-sm md:gap-md place-items-center w-full max-w-sm mx-auto perspective-1000" id="game-grid">
<!-- Cards will be generated here by JavaScript -->
</div>
<div class="flex justify-center mt-md">
<button class="bg-gradient-to-b from-primary to-surface-tint text-on-primary font-label-bold text-label-bold py-md px-xl rounded-full shadow-[0_8px_20px_rgba(255,105,180,0.2)] active:scale-95 transition-transform flex items-center gap-sm" id="reset-btn">
<span class="material-symbols-outlined text-[20px]">refresh</span>
      Main Lagi
    </button>
</div>
<div class="fixed inset-0 z-50 flex items-center justify-center bg-surface/90 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-500" id="win-message">
<div class="bg-surface-container rounded-[32px] p-xl flex flex-col items-center gap-md transform scale-90 transition-transform duration-500 shadow-xl w-64 text-center">
<div class="w-24 h-24 bg-primary-container rounded-full flex items-center justify-center mb-sm shadow-[0_0_30px_rgba(255,105,180,0.3)]">
<span class="text-[48px]">🎉</span>
</div>
<h3 class="font-headline-lg text-headline-lg text-primary">YAY!</h3>
<p class="font-body-md text-body-md text-on-surface">Kamu menemukan semua pasangan!</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-sm">Langkah: <span class="font-label-bold" id="final-moves">0</span></p>
<button class="mt-lg w-full bg-primary text-on-primary font-label-bold py-md rounded-xl active:scale-95 transition-transform" id="play-again-btn">
        Main Sekali Lagi
      </button>
</div>
</div>
</div>
<style>
  .perspective-1000 {
    perspective: 1000px;
  }
  .preserve-3d {
    transform-style: preserve-3d;
  }
  .backface-hidden {
    backface-visibility: hidden;
  }
  .rotate-y-180 {
    transform: rotateY(180deg);
  }
  .pattern-hearts {
    background-color: #ffd8e6;
    background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 16.5l-1.45-1.32C5.4 12.36 2 9.28 2 5.5 2 2.42 4.42 0 7.5 0c1.74 0 3.41.81 4.5 2.09C13.09.81 14.76 0 16.5 0 19.58 0 22 2.42 22 5.5c0 3.78-3.4 6.86-6.55 9.68L14 16.5l-4-4-4 4z' fill='%23ac2471' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
  }
  
  .card {
    transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
  }
  
  .card.flipped {
    transform: rotateY(180deg);
  }
</style>
<script>
  (function() {
    // Koleksi emoji lucu
    const allEmojis = ['💖', '⭐', '🌸', '🍬', '🌈', '🍭', '🎀', '👑', '🦄', '🍦', '🎨', '🎁'];
    let currentEmojiPairs = 8; // Default 16 kartu (8 pasang)
    let cards = [];
    
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let lockBoard = false;
    let timerInterval = null;
    let seconds = 0;
    let gameStarted = false;

    const grid = document.getElementById('game-grid');
    const movesDisplay = document.getElementById('moves-display');
    const timeDisplay = document.getElementById('time-display');
    const resetBtn = document.getElementById('reset-btn');
    const playAgainBtn = document.getElementById('play-again-btn');
    const winMessage = document.getElementById('win-message');
    const finalMoves = document.getElementById('final-moves');
    const difficultySelect = document.getElementById('difficulty-select');

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function startTimer() {
      if (gameStarted) return;
      gameStarted = true;
      timerInterval = setInterval(() => {
        seconds++;
        timeDisplay.textContent = formatTime(seconds);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function createBoard() {
      grid.innerHTML = '';
      
      // Ambil emoji sesuai jumlah pasangan yang dipilih
      const selectedEmojis = allEmojis.slice(0, currentEmojiPairs);
      cards = [...selectedEmojis, ...selectedEmojis];
      shuffle(cards);
      
      cards.forEach((emoji, index) => {
        const cardContainer = document.createElement('div');
        cardContainer.className = 'relative w-full aspect-square cursor-pointer preserve-3d card shadow-[0_4px_12px_rgba(255,105,180,0.1)] rounded-xl';
        cardContainer.dataset.emoji = emoji;
        cardContainer.dataset.index = index;

        const cardFront = document.createElement('div');
        cardFront.className = 'absolute inset-0 w-full h-full backface-hidden rounded-xl pattern-hearts flex items-center justify-center';
        
        const cardBack = document.createElement('div');
        // Ukuran font otomatis menyesuaikan jika memilih mode sulit (24 kartu)
        const textSize = currentEmojiPairs === 12 ? 'text-2xl md:text-3xl' : 'text-3xl md:text-4xl';
        cardBack.className = `absolute inset-0 w-full h-full backface-hidden rotate-y-180 bg-surface-container-lowest rounded-xl flex items-center justify-center ${textSize} shadow-inner`;
        cardBack.textContent = emoji;

        cardContainer.appendChild(cardFront);
        cardContainer.appendChild(cardBack);
        
        cardContainer.addEventListener('click', flipCard);
        
        grid.appendChild(cardContainer);
      });
    }

    function flipCard() {
      if (lockBoard) return;
      if (this === flippedCards[0]) return;
      if (this.classList.contains('flipped')) return;

      startTimer();

      this.classList.add('flipped');
      this.classList.add('shadow-[0_8px_24px_rgba(255,105,180,0.2)]');

      if (!flippedCards[0]) {
        flippedCards[0] = this;
        return;
      }

      flippedCards[1] = this;
      moves++;
      movesDisplay.textContent = moves;
      
      checkForMatch();
    }

    function checkForMatch() {
      let isMatch = flippedCards[0].dataset.emoji === flippedCards[1].dataset.emoji;

      if (isMatch) {
        disableCards();
      } else {
        unflipCards();
      }
    }

    function disableCards() {
      flippedCards[0].removeEventListener('click', flipCard);
      flippedCards[1].removeEventListener('click', flipCard);
      
      resetBoard();

      matchedPairs++;
      if (matchedPairs === currentEmojiPairs) {
        stopTimer();
        setTimeout(showWinScreen, 500);
      }
    }

    function unflipCards() {
      lockBoard = true;

      setTimeout(() => {
        flippedCards[0].classList.remove('flipped', 'shadow-[0_8px_24px_rgba(255,105,180,0.2)]');
        flippedCards[1].classList.remove('flipped', 'shadow-[0_8px_24px_rgba(255,105,180,0.2)]');

        resetBoard();
      }, 1000);
    }

    function resetBoard() {
      [flippedCards, lockBoard] = [[], false];
    }

    function showWinScreen() {
      finalMoves.textContent = moves;
      winMessage.classList.remove('opacity-0', 'pointer-events-none');
      winMessage.firstElementChild.classList.remove('scale-90');
      winMessage.firstElementChild.classList.add('scale-100');
    }

    function hideWinScreen() {
      winMessage.classList.add('opacity-0', 'pointer-events-none');
      winMessage.firstElementChild.classList.remove('scale-100');
      winMessage.firstElementChild.classList.add('scale-90');
    }

    function initGame() {
      stopTimer();
      hideWinScreen();
      currentEmojiPairs = parseInt(difficultySelect.value);
      matchedPairs = 0;
      moves = 0;
      seconds = 0;
      gameStarted = false;
      movesDisplay.textContent = moves;
      timeDisplay.textContent = "00:00";
      resetBoard();
      createBoard();
    }

    difficultySelect.addEventListener('change', initGame);
    resetBtn.addEventListener('click', initGame);
    playAgainBtn.addEventListener('click', initGame);

    // Initial setup
    initGame();
  })();
</script></main></body></html>
