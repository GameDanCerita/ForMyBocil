<!-- Custom Emoji Rain specific to this screen to ensure it runs even if shell script fails or to add specific emojis -->
<script>
    (function() {
      const container = document.createElement('div');
      container.className = 'fixed inset-0 pointer-events-none z-0 overflow-hidden';
      document.body.appendChild(container);

      const specificEmojis = ['💖', '🦄', '🍭', '🌸', '✨'];

      function spawnEmoji() {
        if(window.location.hash !== '' && window.location.hash !== '#beranda') return;
        const emoji = document.createElement('div');
        emoji.innerText = specificEmojis[Math.floor(Math.random() * specificEmojis.length)];
        emoji.style.position = 'absolute';
        emoji.style.top = '-50px';
        emoji.style.left = Math.random() * 100 + 'vw';
        emoji.style.fontSize = (Math.random() * 24 + 16) + 'px';
        emoji.style.opacity = (Math.random() * 0.4 + 0.3).toString();
        emoji.style.userSelect = 'none';
        emoji.style.pointerEvents = 'none';
        emoji.style.zIndex = '0';
        emoji.style.transform = `rotate(${Math.random() * 360}deg)`;
        
        const duration = Math.random() * 4 + 6;
        emoji.style.transition = `transform ${duration}s linear, top ${duration}s linear`;
        
        container.appendChild(emoji);

        requestAnimationFrame(() => {
          emoji.style.top = '110vh';
          emoji.style.transform = `rotate(${Math.random() * 720}deg)`;
        });

        setTimeout(() => {
          if(container.contains(emoji)) emoji.remove();
        }, duration * 1000);
      }

      const rainInterval = setInterval(spawnEmoji, 800);
      
      // Cleanup when navigating away (simulate)
      window.addEventListener('hashchange', () => {
         if(window.location.hash !== '' && window.location.hash !== '#beranda') {
             clearInterval(rainInterval);
             container.remove();
         }
      });
    })();
  </script>
